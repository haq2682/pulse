# ArgoCD Application - keeps the `production` namespace in sync with
# .k8s/bases. Apply with: kubectl apply -f .k8s/argocd/argocd.yaml
#
# Image Updater annotations: update-strategy `latest` picks the most
# recently built image; allow-tags restricts to immutable `sha-*` tags
# (never the floating `latest` tag) - matches ci.yaml's tagging.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulse
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      pulse-frontend=haq2682/pulse-frontend,
      pulse-nginx=haq2682/pulse-nginx,
      pulse-api=haq2682/pulse-api,
      pulse-python=haq2682/pulse-python,
      pulse-postgresql=haq2682/pulse-postgresql,
      pulse-minio=haq2682/pulse-minio,
      pulse-spark=haq2682/pulse-spark,
      pulse-debezium=haq2682/pulse-debezium,
      pulse-airflow=haq2682/pulse-airflow
    argocd-image-updater.argoproj.io/pulse-frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-frontend.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-nginx.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-nginx.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-api.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-api.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-python.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-python.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-postgresql.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-postgresql.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-minio.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-minio.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-spark.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-spark.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-debezium.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-debezium.allow-tags: regexp:^sha-.*$
    argocd-image-updater.argoproj.io/pulse-airflow.update-strategy: latest
    argocd-image-updater.argoproj.io/pulse-airflow.allow-tags: regexp:^sha-.*$
spec:
  project: default
  source:
    repoURL: https://github.com/haq2682/pulse.git
    targetRevision: main
    path: .k8s/bases
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
