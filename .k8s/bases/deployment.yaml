# ─────────────────────────────────────────────────────────────────────────
# API (FastAPI)
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-api
  namespace: production
  labels:
    app: pulse-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-api
  template:
    metadata:
      labels:
        app: pulse-api
    spec:
      containers:
        - name: pulse-api
          image: pulse-api
          ports:
            - containerPort: 8000
          env:
            # mapping/map.py's Spark driver runs in this container - executors
            # on pulse-spark-worker call back on this address, and only the
            # pod's own IP is guaranteed to reach the right replica.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Must match the build-time NLTK download path or the mapping
            # stage silently redownloads at runtime.
            - name: NLTK_DATA
              value: /usr/local/share/nltk_data
            - name: POSTGRES_SERVER
              value: pulse-postgresql
            - name: POSTGRES_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_DB
            - name: MINIO_ENDPOINT
              value: pulse-minio:9000
            - name: KAFKA_BOOTSTRAP
              value: pulse-kafka:9092
            - name: KAFKA_CONNECT_URL
              value: http://pulse-debezium:8083
            - name: REDIS_HOST
              value: pulse-redis
            - name: REDIS_PORT
              value: "6379"
            - name: SPARK_MASTER_URL
              value: spark://pulse-spark-master:7077
            - name: PYSPARK_PYTHON
              value: python3.10
            - name: PYSPARK_DRIVER_PYTHON
              value: python3.10
            - name: GEMINI_MODEL
              value: gemini-2.0-flash-lite
            - name: AIRFLOW_BASE_URL
              value: http://pulse-airflow-webserver:8080
            - name: AIRFLOW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_ADMIN_USER
            - name: AIRFLOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: AIRFLOW_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: SMTP_HOST
              value: smtp.gmail.com
            - name: SMTP_PORT
              value: "587"
            - name: FROM_EMAIL
              value: "Pulse Analytics Engine <no-reply@example.com>"
            # NodePort must match ingress-nginx's assigned port and the
            # Google Cloud Console redirect URI if it ever changes.
            - name: GOOGLE_REDIRECT_URI
              value: https://pulse-engine.com:32249/api/auth/google/callback
            - name: FRONTEND_URL
              value: https://pulse-engine.com:32249
            - name: SESSION_EXPIRE_MINUTES
              value: "1440"
            - name: PASSWORD_RESET_EXPIRE_MINUTES
              value: "30"
            - name: ENVIRONMENT
              value: production
          envFrom:
            - secretRef:
                name: pulse-postgresql-secret
            - secretRef:
                name: pulse-minio-secret
            - secretRef:
                name: pulse-api-secret
          # Headroom for uvicorn + the mapping subprocess's own spaCy/nltk/
          # sentence-transformers models + the Spark driver JVM they spawn,
          # all resident in this one container.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 3584Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
# ─────────────────────────────────────────────────────────────────────────
# Frontend
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-frontend
  namespace: production
  labels:
    app: pulse-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-frontend
  template:
    metadata:
      labels:
        app: pulse-frontend
    spec:
      containers:
        - name: pulse-frontend
          image: pulse-frontend
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
# ─────────────────────────────────────────────────────────────────────────
# Nginx gateway
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-nginx
  namespace: production
  labels:
    app: pulse-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-nginx
  template:
    metadata:
      labels:
        app: pulse-nginx
    spec:
      containers:
        - name: pulse-nginx
          image: pulse-nginx
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM_HOST
              value: pulse-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: pulse-nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.1
          args:
            - --nginx.scrape-uri=http://localhost/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
