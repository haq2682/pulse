# Deployments (and two Jobs) for every active service in docker-compose.yml.
#
# docker-compose `command:` maps to k8s `args:` (not `command:`, which
# overrides ENTRYPOINT); pulse-minio-init is the one exception since it
# uses docker-compose's `entrypoint:`, so it maps to k8s `command:`.
#
# The Secret objects referenced below are not defined here - they're
# synced from Vault by the ExternalSecret objects in secrets/.
#
# Airflow task execution uses KubernetesPodOperator (pulse-airflow
# ServiceAccount, see rbac.yaml) instead of docker.sock.

# ─────────────────────────────────────────────────────────────────────────
# PostgreSQL
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-postgresql
  namespace: production
  labels:
    app: pulse-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume: never run two pods at once
  selector:
    matchLabels:
      app: pulse-postgresql
  template:
    metadata:
      labels:
        app: pulse-postgresql
    spec:
      containers:
        - name: pulse-postgresql
          image: pulse-postgresql
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: pulse-postgresql-secret
          env:
            - name: POSTGRESQL_WAL_LEVEL
              value: "logical"
          volumeMounts:
            - name: pulse-postgresql-storage
              mountPath: /bitnami/postgresql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
        - name: pulse-postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_DB
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/$(POSTGRES_DB)?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: pulse-postgresql-storage
          persistentVolumeClaim:
            claimName: pulse-postgresql-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# MinIO
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-minio
  namespace: production
  labels:
    app: pulse-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-minio
  template:
    metadata:
      labels:
        app: pulse-minio
    spec:
      containers:
        - name: pulse-minio
          image: pulse-minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: pulse-minio-secret
          volumeMounts:
            - name: pulse-minio-storage
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: pulse-minio-storage
          persistentVolumeClaim:
            claimName: pulse-minio-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# MinIO bucket bootstrap
# ─────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-minio-init
  namespace: production
  labels:
    app: pulse-minio-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: pulse-minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pulse-minio-init
          image: minio/mc
          envFrom:
            - secretRef:
                name: pulse-minio-secret
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MinIO...";
              until mc alias set local http://pulse-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                sleep 2;
              done;
              echo "Creating buckets...";
              mc mb --ignore-existing local/pulse-bucket-1;
              mc mb --ignore-existing local/pulse-test-bucket;
              mc mb --ignore-existing local/pulse-checkpoints;
              echo "Buckets created";
---
# ─────────────────────────────────────────────────────────────────────────
# Zookeeper
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-zookeeper
  namespace: production
  labels:
    app: pulse-zookeeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-zookeeper
  template:
    metadata:
      labels:
        app: pulse-zookeeper
    spec:
      initContainers:
        - name: jmx-exporter-init
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - curl -sSL -o /jmx-exporter/jmx_prometheus_javaagent.jar https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
          volumeMounts:
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
      containers:
        - name: pulse-zookeeper
          image: confluentinc/cp-zookeeper:7.7.0
          ports:
            - containerPort: 2181
            - name: jmx-metrics
              containerPort: 7071
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/etc/jmx-exporter/zookeeper.yml"
          volumeMounts:
            - name: pulse-zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: pulse-zookeeper-log
              mountPath: /var/lib/zookeeper/log
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
              readOnly: true
            - name: pulse-jmx-exporter-config
              mountPath: /etc/jmx-exporter
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: pulse-zookeeper-data
          persistentVolumeClaim:
            claimName: pulse-zookeeper-data-pvc
        - name: pulse-zookeeper-log
          persistentVolumeClaim:
            claimName: pulse-zookeeper-log-pvc
        - name: pulse-jmx-exporter-jar
          emptyDir: {}
        - name: pulse-jmx-exporter-config
          configMap:
            name: pulse-jmx-exporter-zookeeper-config
---
# ─────────────────────────────────────────────────────────────────────────
# Kafka
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-kafka
  namespace: production
  labels:
    app: pulse-kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-kafka
  template:
    metadata:
      labels:
        app: pulse-kafka
    spec:
      initContainers:
        - name: jmx-exporter-init
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - curl -sSL -o /jmx-exporter/jmx_prometheus_javaagent.jar https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
          volumeMounts:
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
      containers:
        - name: pulse-kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - containerPort: 9092
            - name: jmx-metrics
              containerPort: 7071
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: pulse-zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            # Must be the Service DNS name so other pods can resolve it.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://pulse-kafka:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/etc/jmx-exporter/kafka.yml"
          volumeMounts:
            - name: pulse-kafka-storage
              mountPath: /var/lib/kafka/data
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
              readOnly: true
            - name: pulse-jmx-exporter-config
              mountPath: /etc/jmx-exporter
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: pulse-kafka-storage
          persistentVolumeClaim:
            claimName: pulse-kafka-pvc
        - name: pulse-jmx-exporter-jar
          emptyDir: {}
        - name: pulse-jmx-exporter-config
          configMap:
            name: pulse-jmx-exporter-kafka-config
---
# ─────────────────────────────────────────────────────────────────────────
# Redis
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-redis
  namespace: production
  labels:
    app: pulse-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-redis
  template:
    metadata:
      labels:
        app: pulse-redis
    spec:
      containers:
        - name: pulse-redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: pulse-redis-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: pulse-redis-exporter
          image: oliver006/redis_exporter:v1.88.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: pulse-redis-storage
          persistentVolumeClaim:
            claimName: pulse-redis-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# Debezium (Kafka Connect + connectors)
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-debezium
  namespace: production
  labels:
    app: pulse-debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-debezium
  template:
    metadata:
      labels:
        app: pulse-debezium
    spec:
      initContainers:
        - name: jmx-exporter-init
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - curl -sSL -o /jmx-exporter/jmx_prometheus_javaagent.jar https://github.com/prometheus/jmx_exporter/releases/download/1.6.0/jmx_prometheus_javaagent-1.6.0.jar
          volumeMounts:
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
      containers:
        - name: pulse-debezium
          image: pulse-debezium
          ports:
            - containerPort: 8083
            - name: jmx-metrics
              containerPort: 7071
          env:
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx-exporter/jmx_prometheus_javaagent.jar=7071:/etc/jmx-exporter/kafka-connect.yml"
            # Explicit heap size: the JVM's container-aware default OOMKilled
            # this pod while scanning ~15 bundled connector plugins.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx1536m"
            - name: BOOTSTRAP_SERVERS
              value: pulse-kafka:9092
            - name: GROUP_ID
              value: debezium-connect
            - name: CONFIG_STORAGE_TOPIC
              value: debezium_configs
            - name: OFFSET_STORAGE_TOPIC
              value: debezium_offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium_status
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            # No credentials file mounted yet - only affects GCP connectors
            # (e.g. Spanner), unused currently.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/gcp/credentials.json
          volumeMounts:
            - name: pulse-jmx-exporter-jar
              mountPath: /jmx-exporter
              readOnly: true
            - name: pulse-jmx-exporter-config
              mountPath: /etc/jmx-exporter
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: pulse-jmx-exporter-jar
          emptyDir: {}
        - name: pulse-jmx-exporter-config
          configMap:
            name: pulse-jmx-exporter-kafka-connect-config
---
# ─────────────────────────────────────────────────────────────────────────
# Spark Master
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-spark-master
  namespace: production
  labels:
    app: pulse-spark-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pulse-spark-master
  template:
    metadata:
      labels:
        app: pulse-spark-master
    spec:
      containers:
        - name: pulse-spark-master
          image: pulse-spark
          args:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
          ports:
            - containerPort: 7077
            - containerPort: 8080
            - containerPort: 4040
          env:
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MINIO_ENDPOINT
              value: pulse-minio:9000
            - name: PYSPARK_PYTHON
              value: python3.10
            - name: PYSPARK_DRIVER_PYTHON
              value: python3.10
            - name: SPARK_MASTER_OPTS
              value: "-Dspark.shuffle.service.enabled=true -Dspark.ui.prometheus.enabled=true"
          envFrom:
            - secretRef:
                name: pulse-minio-secret
          volumeMounts:
            - name: pulse-spark-master-storage
              mountPath: /opt/spark/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: pulse-spark-master-storage
          persistentVolumeClaim:
            claimName: pulse-spark-master-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# Spark Worker
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-spark-worker
  namespace: production
  labels:
    app: pulse-spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-spark-worker
  template:
    metadata:
      labels:
        app: pulse-spark-worker
    spec:
      # Gives a decommissioning worker time to migrate shuffle blocks
      # before SIGKILL - paired with the preStop hook below and pdb.yaml.
      terminationGracePeriodSeconds: 120
      containers:
        - name: pulse-spark-worker
          image: pulse-spark
          args:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://pulse-spark-master:7077
          ports:
            - containerPort: 8081
          env:
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: SPARK_WORKER_MEMORY
              value: 2g
            - name: PYSPARK_PYTHON
              value: python3.10
            - name: PYSPARK_DRIVER_PYTHON
              value: python3.10
            # spark.decommission.enabled is required for the preStop hook's
            # signal below to actually trigger a graceful shutdown.
            - name: SPARK_WORKER_OPTS
              value: "-Dspark.shuffle.service.enabled=true -Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=300 -Dspark.worker.cleanup.appDataTtl=600 -Dspark.ui.prometheus.enabled=true -Dspark.decommission.enabled=true"
            - name: MINIO_ENDPOINT
              value: pulse-minio:9000
          envFrom:
            - secretRef:
                name: pulse-minio-secret
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          lifecycle:
            preStop:
              # Sends SIGPWR to trigger Spark's own decommission handling,
              # then sleeps so it can finish before terminationGracePeriodSeconds.
              exec:
                command: ["/bin/sh", "-c", "kill -s PWR 1; sleep 90"]
---
# ─────────────────────────────────────────────────────────────────────────
# Airflow init
# ─────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: pulse-airflow-init
  namespace: production
  labels:
    app: pulse-airflow-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: pulse-airflow-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pulse-airflow-init
          image: pulse-airflow
          args:
            - bash
            - -c
            - |
              airflow db migrate &&
              airflow db upgrade &&
              airflow connections create-default-connections &&
              airflow users create --username "$AIRFLOW_ADMIN_USER" --password "$AIRFLOW_ADMIN_PASSWORD" --firstname Pulse --lastname Admin --role Admin --email admin@pulse.local
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: airflow.api.auth.backend.basic_auth
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pulse-postgresql:5432/airflow
            # envFrom does not rename keys, so Fernet/secret key need
            # explicit secretKeyRef entries mapping to Airflow's config names.
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_SECRET_KEY
            - name: REDIS_HOST
              value: pulse-redis
            - name: REDIS_PORT
              value: "6379"
            - name: GEMINI_MODEL
              value: gemini-2.0-flash-lite
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: "minio scipy pandas numpy psycopg2-binary"
          envFrom:
            - secretRef:
                name: pulse-airflow-secret
            - secretRef:
                name: pulse-api-secret
          volumeMounts:
            - name: pulse-airflow-logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: pulse-airflow-logs
          persistentVolumeClaim:
            claimName: pulse-airflow-logs-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# Airflow Webserver
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-airflow-webserver
  namespace: production
  labels:
    app: pulse-airflow-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulse-airflow-webserver
  template:
    metadata:
      labels:
        app: pulse-airflow-webserver
    spec:
      serviceAccountName: pulse-airflow
      containers:
        - name: pulse-airflow-webserver
          image: pulse-airflow
          args:
            - airflow
            - webserver
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__API__AUTH_BACKENDS
              value: airflow.api.auth.backend.basic_auth
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pulse-postgresql:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pulse-airflow-secret
                  key: AIRFLOW_SECRET_KEY
            - name: AIRFLOW__WEBSERVER__RATE_LIMIT_STORAGE_URL
              value: redis://pulse-redis:6379/0
            - name: AIRFLOW__WEBSERVER__RATE_LIMIT_ENABLED
              value: "True"
            - name: AIRFLOW__WEBSERVER__RATE_LIMIT_DEFAULT
              value: "200 per day;50 per hour"
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: /opt/airflow/dags
            - name: AIRFLOW__CORE__PLUGINS_FOLDER
              value: /opt/airflow/plugins
            - name: AIRFLOW__LOGGING__BASE_LOG_FOLDER
              value: /opt/airflow/logs
            - name: MINIO_ENDPOINT
              value: pulse-minio:9000
            - name: KAFKA_BOOTSTRAP
              value: pulse-kafka:9092
            - name: POSTGRES_SERVER
              value: pulse-postgresql
            - name: POSTGRES_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: pulse-postgresql-secret
                  key: POSTGRES_DB
            - name: REDIS_HOST
              value: pulse-redis
            - name: REDIS_PORT
              value: "6379"
            - name: GEMINI_MODEL
              value: gemini-2.0-flash-lite
            - name: DEBEZIUM_URL
              value: http://pulse-debezium:8083
            - name: SPARK_MASTER_URL
              value: spark://pulse-spark-master:7077
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Image for every KubernetesPodOperator task pod - keep in sync
            # with the images: transformer in kustomization.yaml.
            - name: PIPELINE_PYTHON_IMAGE
              value: haq2682/pulse-python:latest
            - name: PYTHONPATH
              value: /opt/airflow/utils:/opt/airflow/config
            - name: _PIP_ADDITIONAL_REQUIREMENTS
              value: "minio scipy pandas numpy psycopg2-binary apache-airflow-providers-cncf-kubernetes kubernetes"
            - name: AIRFLOW__METRICS__STATSD_ON
              value: "True"
            - name: AIRFLOW__METRICS__STATSD_HOST
              value: localhost
            - name: AIRFLOW__METRICS__STATSD_PORT
              value: "9125"
            - name: AIRFLOW__METRICS__STATSD_PREFIX
              value: airflow
          envFrom:
            - secretRef:
                name: pulse-airflow-secret
            - secretRef:
                name: pulse-minio-secret
            - secretRef:
                name: pulse-api-secret
          volumeMounts:
            - name: pulse-airflow-logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: pulse-statsd-exporter
          image: prom/statsd-exporter:v0.30.0-distroless
          ports:
            - name: statsd-udp
              containerPort: 9125
              protocol: UDP
            - name: metrics
              containerPort: 9102
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: pulse-airflow-logs
          persistentVolumeClaim:
            claimName: pulse-airflow-logs-pvc
---
# ─────────────────────────────────────────────────────────────────────────
# Airflow Scheduler
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-airflow-scheduler
  namespace: production
  labels:
    app: pulse-airflow-scheduler
