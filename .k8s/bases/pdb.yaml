# minAvailable: 1 stops a voluntary disruption (node drain, autoscaler
# consolidation) from dropping pulse-spark-worker to 0 pods at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulse-spark-worker-pdb
  namespace: production
  labels:
    app: pulse-spark-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pulse-spark-worker
