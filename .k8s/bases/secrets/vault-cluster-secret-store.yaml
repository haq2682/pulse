# ClusterSecretStore: tells ESO how to reach Vault and authenticate.
# caProvider reuses the same vault-tls Secret already mounted into vault-0
# (bootstrap material, created directly with kubectl, never committed).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pulse-vault-store
  labels:
    app: pulse-vault-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc:8200"
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-tls
        namespace: vault
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: kube-system
