# One ClusterSecretStore for the whole project: tells the External Secrets
# Operator (ESO) how to reach Vault and how to authenticate. Every
# ExternalSecret in this directory references it by name. Cluster-scoped
# (not namespace-scoped SecretStore) since ExternalSecrets may eventually
# live in more than one namespace once environment overlays exist.
#
# TLS - Vault's own listener has tls_disable=0 (see terraform/resource.tf's
# helm_release.vault), so this has to speak https, and ESO has to trust the
# self-signed cert it presents. caProvider points ESO at the SAME vault-tls
# Secret already mounted into the vault-0 pod itself (bootstrap material,
# created directly with kubectl, never committed - see
# docs/SECRETS_MANAGEMENT.md) rather than a separate copy: one cert, one
# Secret, read by both sides. This works without any extra RBAC because
# ESO's own ClusterRole already has cluster-wide `get` on Secrets (it has
# to, to create/update Secrets in every namespace an ExternalSecret might
# target) - verified against the live external-secrets-controller
# ClusterRole before relying on it, not assumed.
#
# Docs: https://external-secrets.io/latest/provider/hashicorp-vault/
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: pulse-vault-store
  labels:
    app: pulse-vault-store
spec:
  provider:
    vault:
      server: "https://vault.vault.svc:8200"
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-tls
        namespace: vault
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: kube-system
