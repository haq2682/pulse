apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base layer for the Pulse platform. Deploys into `production`, created
# automatically by ArgoCD's CreateNamespace=true (see .k8s/argocd/argocd.yaml).

resources:
  - storageclass.yaml
  - pvc.yaml
  - deployment.yaml
  - svc.yaml
  - rbac.yaml
  - secrets/vault-cluster-secret-store.yaml
  - secrets/pulse-postgresql-external-secret.yaml
  - secrets/pulse-minio-external-secret.yaml
  - secrets/pulse-airflow-external-secret.yaml
  - secrets/pulse-api-external-secret.yaml
  - hpa.yaml
  - pdb.yaml
  - vpa.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - monitoring.yaml

# zookeeper/kafka/redis use unmodified upstream images, referenced directly
# in deployment.yaml - not listed below since kustomize has nothing to rewrite.
images:
  - name: pulse-frontend
    newName: haq2682/pulse-frontend
    newTag: latest
  - name: pulse-nginx
    newName: haq2682/pulse-nginx
    newTag: latest
  - name: pulse-api
    newName: haq2682/pulse-api
    newTag: latest
  - name: pulse-python
    newName: haq2682/pulse-python
    newTag: latest
  - name: pulse-postgresql
    newName: haq2682/pulse-postgresql
    newTag: latest
  - name: pulse-minio
    newName: haq2682/pulse-minio
    newTag: latest
  - name: pulse-spark
    newName: haq2682/pulse-spark
    newTag: latest
  - name: pulse-debezium
    newName: haq2682/pulse-debezium
    newTag: latest
  - name: pulse-airflow
    newName: haq2682/pulse-airflow
    newTag: latest
