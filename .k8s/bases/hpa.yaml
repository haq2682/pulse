---
# api gets a second metric (memory) alongside CPU - it does in-memory
# pandas/numpy work and drives Spark jobs, so it can get memory-heavy
# without necessarily being CPU-heavy at the same moment. When multiple
# metrics are set, the HPA computes a desired replica count for each and
# scales to whichever asks for MORE replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulse-api-hpa
  namespace: production
  labels:
    app: pulse-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
