# HorizontalPodAutoscalers - requires the Metrics Server running in-cluster.
# Utilization is computed against each container's resource REQUEST, not
# its limit.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulse-spark-worker-hpa
  namespace: production
  labels:
    app: pulse-spark-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-spark-worker
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
