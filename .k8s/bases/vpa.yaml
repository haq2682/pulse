# VerticalPodAutoscalers - VPA is not built into Kubernetes; needs its own
# controller installed separately:
#   git clone https://github.com/kubernetes/autoscaler.git
#   cd autoscaler/vertical-pod-autoscaler && ./hack/vpa-up.sh
#
# updateMode: "Off" only calculates recommendations - never evicts a pod.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: pulse-spark-master-vpa
  namespace: production
  labels:
    app: pulse-spark-master
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-spark-master
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: pulse-spark-master
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
---
