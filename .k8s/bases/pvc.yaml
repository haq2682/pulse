---
# Shared by the airflow-init Job, pulse-airflow-webserver, and
# pulse-airflow-scheduler, same as docker-compose.yml's single airflow_logs
# volume. This only works because ReadWriteOnce allows concurrent mounts from
# multiple pods as long as they land on the same node - guaranteed here since
# minikube only has one node. On a real multi-node cluster this PVC would
# need a ReadWriteMany-capable StorageClass (e.g. NFS/EFS) instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-airflow-logs-pvc
  namespace: production
  labels:
    app: pulse-airflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pulse-storage
  resources:
    requests:
      storage: 5Gi
