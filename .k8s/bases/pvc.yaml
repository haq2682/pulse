# Shared by airflow-init, pulse-airflow-webserver, and pulse-airflow-
# scheduler - relies on all pods landing on minikube's one node. A real
# multi-node cluster needs a ReadWriteMany StorageClass (e.g. NFS/EFS) instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-airflow-logs-pvc
  namespace: production
  labels:
    app: pulse-airflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pulse-storage
  resources:
    requests:
      storage: 5Gi
