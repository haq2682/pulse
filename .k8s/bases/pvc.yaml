# All PVCs use ReadWriteOnce - the "pulse-storage" StorageClass is a
# hostPath provisioner, which only ever supports ReadWriteOnce.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-postgresql-pvc
  namespace: production
  labels:
    app: pulse-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pulse-storage
  resources:
    requests:
      storage: 10Gi
---
