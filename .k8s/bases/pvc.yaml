# One PersistentVolumeClaim per docker-compose named volume that is actually
# mounted by a service. docker-compose.yml also declares "spark_jars" and
# "app" as top-level volumes, but neither one is mounted by any service in
# the file, so no PVC is created for them here.
#
# All PVCs use ReadWriteOnce (a single node may mount them read-write) because
# the "pulse-storage" StorageClass is a hostPath provisioner, which only ever
# supports ReadWriteOnce. On minikube (a single-node cluster) this is not a
# limitation: every pod is scheduled on that one node anyway.
#
# Docs: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-postgresql-pvc
  namespace: production
  labels:
    app: pulse-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pulse-storage
  resources:
    requests:
      storage: 10Gi
---
