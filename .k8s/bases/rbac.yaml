# RBAC for Airflow's Kubernetes-native task execution (KubernetesPodOperator)
# - scoped replacement for /var/run/docker.sock: create/watch/delete Pods
# in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-airflow
  namespace: production
  labels:
    app: pulse-airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse-airflow-task-runner
  namespace: production
  labels:
    app: pulse-airflow
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # patch is required by KubernetesPodOperator's startup-timeout handling.
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulse-airflow-task-runner
  namespace: production
  labels:
    app: pulse-airflow
subjects:
  - kind: ServiceAccount
    name: pulse-airflow
roleRef:
  kind: Role
  name: pulse-airflow-task-runner
  apiGroup: rbac.authorization.k8s.io
