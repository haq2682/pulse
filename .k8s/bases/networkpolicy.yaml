apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-postgresql-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-postgresql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse-api
        - podSelector:
            matchLabels:
              app: pulse-task
        - podSelector:
            matchLabels:
              app: pulse-db-stream
        - podSelector:
            matchLabels:
              app: pulse-api-stream
        - podSelector:
            matchLabels:
              app: pulse-debezium
        - podSelector:
            matchLabels:
              app: pulse-airflow-webserver
