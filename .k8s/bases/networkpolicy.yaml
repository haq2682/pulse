# Postgres (the CDC source it reads from).
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-debezium-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-debezium
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
