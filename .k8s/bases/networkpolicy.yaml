# ─────────────────────────────────────────────────────────────────────────
# Vault - only the External Secrets Operator's main controller pod ever
# reads from it (see vault/policies/, vault/scripts/04-apply-policies-and-
# roles.sh). ESO's chart also deploys a cert-controller and a webhook pod
# in kube-system - neither of those talks to Vault, so ingress is scoped to
# the controller pod specifically (app.kubernetes.io/name: external-
# secrets), not all of kube-system. Egress needs DNS (to resolve
# kubernetes.default.svc for its own Kubernetes-auth TokenReview calls to
# the API server) - nothing else; Vault itself never calls out anywhere.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-vault-netpol
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─────────────────────────────────────────────────────────────────────────
# External Secrets Operator (main controller only, see the note above) -
# egress to Vault, plus DNS to resolve vault.vault.svc in the first place.
# No ingress rule: nothing calls the controller pod directly - it acts as
# a client (to Vault, to the Kubernetes API to write Secrets) rather than
# serving requests of its own.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-external-secrets-netpol
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
