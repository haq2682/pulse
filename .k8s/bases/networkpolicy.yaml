            matchLabels:
              app: pulse-airflow-scheduler
        - podSelector:
            matchLabels:
              app: pulse-airflow-init
      ports:
        - protocol: TCP
          port: 5432
    # External DB client access via the pulse-postgresql-nodeport Service -
    # no pod identity to scope, so this is a broad "allow from anywhere".
