# ─────────────────────────────────────────────────────────────────────────
# PostgreSQL - a database only ever accepts connections, it never
# initiates any of its own. Ingress from every service that has
# POSTGRES_* env vars wired in deployment.yaml, including pulse-debezium
# (CDC reads the replication stream).
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-postgresql-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-postgresql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse-api
        - podSelector:
            matchLabels:
              app: pulse-task
        - podSelector:
            matchLabels:
              app: pulse-db-stream
        - podSelector:
            matchLabels:
              app: pulse-api-stream
        - podSelector:
            matchLabels:
              app: pulse-nifi
        - podSelector:
            matchLabels:
              app: pulse-debezium
        - podSelector:
            matchLabels:
              app: pulse-airflow-webserver
        - podSelector:
            matchLabels:
              app: pulse-airflow-scheduler
        - podSelector:
            matchLabels:
              app: pulse-airflow-init
      ports:
        - protocol: TCP
          port: 5432
    # External DB client access (DBeaver, Beekeeper Studio, ...) via the
    # pulse-postgresql-nodeport Service in svc.yaml. NodePort
    # traffic arrives at the pod as if from outside the cluster entirely -
    # there's no pod identity to scope a podSelector to, so this is
    # necessarily a broad "allow from anywhere" rule, unlike every other
    # rule in this file. It only opens port 5432, and only takes effect at
    # all once a policy-enforcing CNI is in use (see the note at the top of
    # this file) - today this NodePort is reachable regardless either way.
    - from: []
      ports:
        - protocol: TCP
          port: 5432
    # postgres_exporter sidecar - see the MONITORING note at the top of
    # this file.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─────────────────────────────────────────────────────────────────────────
# MinIO - object storage backing service. Ingress from every service that
# has MINIO_* env vars wired, including both one-shot Jobs.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-minio-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-minio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse-api
        - podSelector:
            matchLabels:
              app: pulse-task
        - podSelector:
            matchLabels:
              app: pulse-db-stream
        - podSelector:
            matchLabels:
              app: pulse-api-stream
        - podSelector:
            matchLabels:
              app: pulse-spark-master
        - podSelector:
            matchLabels:
              app: pulse-spark-worker
        - podSelector:
            matchLabels:
              app: pulse-nifi
        - podSelector:
            matchLabels:
              app: pulse-airflow-webserver
        - podSelector:
            matchLabels:
              app: pulse-airflow-scheduler
        - podSelector:
            matchLabels:
              app: pulse-airflow-init
        - podSelector:
            matchLabels:
              app: pulse-minio-init
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
    # The ingress-nginx controller proxies minio.pulse-engine.com here
    # (see ingress.yaml) - console port only, the S3 API port stays
    # internal-only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 9001
    # MinIO's native Prometheus endpoints live on the S3 API port itself
    # (see monitoring.yaml's pulse-minio ServiceMonitor) - see the
    # MONITORING note at the top of this file.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─────────────────────────────────────────────────────────────────────────
# Spark Master - workers register with it (spark://pulse-spark-master:7077)
# and api/python submit jobs to it on the same port.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-spark-master-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-spark-master
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse-spark-worker
        - podSelector:
            matchLabels:
              app: pulse-api
        - podSelector:
            matchLabels:
              app: pulse-task
        - podSelector:
            matchLabels:
              app: pulse-db-stream
        - podSelector:
            matchLabels:
              app: pulse-api-stream
      ports:
        - protocol: TCP
          port: 7077
    # The ingress-nginx controller proxies spark.pulse-engine.com here
    # (see ingress.yaml) - only the dashboard port, not 7077 (Spark's own
    # RPC protocol, which was never HTTP and isn't reachable via Ingress).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Spark's built-in Prometheus servlet, also on the UI port - see the
    # MONITORING note at the top of this file.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pulse-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─────────────────────────────────────────────────────────────────────────
# Spark Worker - registers itself with the master; Spark's master<->worker
# RPC is bidirectional (heartbeats/task dispatch flow both ways), so
# ingress from the master is allowed too, not just egress to it.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse-spark-worker-netpol
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: pulse-spark-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pulse-spark-master
      ports:
        - protocol: TCP
          port: 8081
    # Same Prometheus servlet as pulse-spark-master above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: pulse-spark-master
      ports:
        - protocol: TCP
          port: 7077
    - to:
        - podSelector:
            matchLabels:
              app: pulse-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# ─────────────────────────────────────────────────────────────────────────
# Zookeeper - only Kafka talks to it.
