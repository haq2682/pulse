    - to:
        - podSelector:
            matchLabels:
              app: pulse-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: pulse-kafka
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: pulse-redis
      ports:
