      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-zookeeper
  namespace: production
  labels:
    app: pulse-zookeeper
spec:
  type: ClusterIP
  selector:
    app: pulse-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: jmx-metrics
      port: 7071
      targetPort: 7071
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-kafka
  namespace: production
  labels:
    app: pulse-kafka
spec:
  # Headless: Kafka's own controller connects to itself via
  # KAFKA_ADVERTISED_LISTENERS=pulse-kafka:9092, and a pod reaching its own
  # Service's ClusterIP is a hairpin NAT path that hangs on this cluster.
  clusterIP: None
  selector:
    app: pulse-kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: jmx-metrics
      port: 7071
      targetPort: 7071
---
