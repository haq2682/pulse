# One ClusterIP Service per Deployment that listens on a port. Named ports
# beyond the app's own port back exporter sidecars/JMX javaagents, referenced
# by name in monitoring.yaml's ServiceMonitors.
apiVersion: v1
kind: Service
metadata:
  name: pulse-frontend
  namespace: production
  labels:
    app: pulse-frontend
spec:
  type: ClusterIP
  selector:
    app: pulse-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-nginx
  namespace: production
  labels:
    app: pulse-nginx
spec:
  type: ClusterIP
  selector:
    app: pulse-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 9113
      targetPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-api
  namespace: production
  labels:
    app: pulse-api
spec:
  type: ClusterIP
  selector:
    app: pulse-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-postgresql
  namespace: production
  labels:
    app: pulse-postgresql
spec:
  type: ClusterIP
  selector:
    app: pulse-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
---
# Second Service, same pods: NodePort for direct desktop SQL client access
# (Postgres speaks its own wire protocol, not HTTP, so it can't go through
# Ingress). nodePort pinned to 30432 rather than auto-assigned.
apiVersion: v1
kind: Service
metadata:
  name: pulse-postgresql-nodeport
  namespace: production
  labels:
    app: pulse-postgresql
spec:
  type: NodePort
  selector:
    app: pulse-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-minio
  namespace: production
  labels:
    app: pulse-minio
spec:
  type: ClusterIP
  selector:
    app: pulse-minio
  ports:
    - name: s3-api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-spark-master
  namespace: production
  labels:
    app: pulse-spark-master
spec:
  type: ClusterIP
  selector:
    app: pulse-spark-master
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
    - name: ui
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-spark-worker
  namespace: production
  labels:
    app: pulse-spark-worker
spec:
  type: ClusterIP
  selector:
