# One Ingress, host-based routing - a dedicated subdomain per service so
# apps like Airflow/Spark that assume they own the root path work unmodified.
#
# TLS Secret "pulse-tls" is not committed here - created directly with
# `kubectl create secret tls`. Regenerate with:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout pulse-engine.key -out pulse-engine.crt \
#     -subj "/CN=pulse-engine.com/O=pulse-dev" \
#     -addext "subjectAltName=DNS:pulse-engine.com,DNS:*.pulse-engine.com"
#   kubectl create secret tls pulse-tls --cert=pulse-engine.crt --key=pulse-engine.key
#
# Kafka and PostgreSQL are not routed here - Ingress is HTTP(S)-only.
# PostgreSQL is exposed via a NodePort Service instead (see svc.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  namespace: production
  labels:
    app: pulse-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pulse-engine.com
        - spark.pulse-engine.com
        - airflow.pulse-engine.com
        - minio.pulse-engine.com
      secretName: pulse-tls
  rules:
    - host: pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-nginx
                port:
                  number: 80
    - host: spark.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-spark-master
                port:
                  number: 8080
    - host: airflow.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-airflow-webserver
                port:
                  number: 8080
    - host: minio.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-minio
                port:
                  number: 9001
