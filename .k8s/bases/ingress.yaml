# One Ingress, host-based routing (a separate subdomain per service, not a
# path per service). This matters for NiFi/Airflow/Spark specifically: web
# apps like these generate links and redirects assuming they own the whole
# path space, so putting one behind e.g. pulse-engine.com/nifi tends to
# break its own UI (broken asset paths, redirects that drop the prefix).
# A dedicated host avoids that entirely - each app still thinks it's being
# accessed at "/".
#
# TLS: a self-signed certificate for pulse-engine.com + *.pulse-engine.com
# (one cert covers every host below) was generated locally and loaded
# directly as a Kubernetes Secret named "pulse-tls" - it is NOT committed
# anywhere in this repo (the private key never should be). Your browser
# will show a "not secure" / certificate-warning page the first time you
# visit each host - that's expected for a self-signed cert; the connection
# is still genuinely encrypted, there's just no public CA vouching for it.
# Regenerate it any time with:
#
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout pulse-engine.key -out pulse-engine.crt \
#     -subj "/CN=pulse-engine.com/O=pulse-dev" \
#     -addext "subjectAltName=DNS:pulse-engine.com,DNS:*.pulse-engine.com"
#   kubectl create secret tls pulse-tls --cert=pulse-engine.crt --key=pulse-engine.key
#
# See docs/INGRESS_ACCESS.md for /etc/hosts entries, exact URLs (this
# cluster's ingress controller is NodePort, not LoadBalancer, so the ports
# aren't the plain 443/80 you'd normally expect), and the DBeaver/Beekeeper
# Postgres connection details.
#
# NOT included here: Kafka and PostgreSQL. Ingress is an HTTP(S)-only
# mechanism - it cannot carry Kafka's or Postgres's own binary wire
# protocols. Postgres is exposed separately via a NodePort Service instead
# (see svc.yaml, pulse-postgresql-external) - same docs file covers it.
# Kafka is not exposed externally in this pass; see docs/INGRESS_ACCESS.md
# for why and what the real options are.
#
# Docs: https://kubernetes.io/docs/concepts/services-networking/ingress/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  namespace: production
  labels:
    app: pulse-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pulse-engine.com
        - spark.pulse-engine.com
        - airflow.pulse-engine.com
        - minio.pulse-engine.com
      secretName: pulse-tls
  rules:
    # Main app - the nginx gateway (SPA + /api + /upload, same-origin).
    - host: pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-nginx
                port:
                  number: 80
    # Spark Master web UI (port 8080 only - 7077 is Spark's own RPC wire
    # protocol, not HTTP, and can't go through an Ingress either).
    - host: spark.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-spark-master
                port:
                  number: 8080
    - host: airflow.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-airflow-webserver
                port:
                  number: 8080
    # MinIO console (port 9001 - the browser-facing admin UI). Port 9000
    # (the S3 API) is also HTTP-based and technically ingress-able, but
    # nothing browses the raw S3 API directly, so it's left internal-only.
    - host: minio.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-minio
                port:
                  number: 9001
---
# NiFi gets its own Ingress object, separate from the shared one above -
# nginx.ingress.kubernetes.io/backend-protocol is set Ingress-wide, and
# NiFi is the one backend here that must be reached over HTTPS, not HTTP.
# With SINGLE_USER_CREDENTIALS_USERNAME/PASSWORD set (see deployment.yaml),
# NiFi's own web server enforces HTTPS-only - its single-user auth provider
# requires a secure channel, so even though NIFI_WEB_HTTP_PORT=8080 is also
# set, HTTPS wins and NiFi only ever binds 8443 (verified live: the pod's
# own startup log shows only an SSL connector on 8443, no HTTP connector at
# all). Routing this Ingress at :8080 like every other host here left
# nothing listening on the other end - hence the 503s, and the liveness/
# readiness probes (deployment.yaml, tcpSocket port 8080) killing the pod
# in a loop for the same reason. ingress-nginx defaults to NOT verifying
# the backend's certificate (NiFi's is self-signed, generated on first
# boot) - fine for this same trust-the-self-signed-cert setup as the rest
# of this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-nifi-ingress
  namespace: production
  labels:
    app: pulse-nifi
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nifi.pulse-engine.com
      secretName: pulse-tls
  rules:
    - host: nifi.pulse-engine.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-nifi
                port:
                  number: 8443
