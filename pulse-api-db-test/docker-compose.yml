services:
  mongodb:
    build:
      context: .
      dockerfile: .docker/mongodb/Dockerfile
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      spark-network:
        ipv4_address: 10.5.0.51
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
      - MONGO_INITDB_DATABASE=pulse-test
    volumes:
      - ./mongodb-data:/data/db
      - ./scripts/mongo-keyfile:/etc/mongo-keyfile
    entrypoint: ["/custom-entrypoint.sh"]
    restart: always

  expressjs:
    build:
      context: .
      dockerfile: .docker/expressjs/Dockerfile
    container_name: expressjs
    working_dir: /app
    ports:
      - "3000:3000"
    networks:
      spark-network:
        ipv4_address: 10.5.0.52
    volumes:
      - ./node:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - MONGO_URI=mongodb://root:rootpassword@10.5.0.51:27017/pulse-test?authSource=admin&directConnection=true
    depends_on:
      - mongodb

networks:
  spark-network:
    external: true
