services:
  frontend:
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    container_name: frontend
    env_file:
      - .env
    environment:
      - VITE_POSTGRES_USER=${POSTGRES_USER}
      - VITE_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - VITE_POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - VITE_POSTGRES_SERVER=${POSTGRES_SERVER}
      - VITE_MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - VITE_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - VITE_MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - VITE_KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP_EXTERNAL}
      - VITE_API_URL=${VITE_API_URL}
    ports:
      - "5173:80"
    networks:
      spark-network:
        ipv4_address: 10.5.0.8
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  
  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: api
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP}
      - KAFKA_BOOTSTRAP_EXTERNAL=${KAFKA_BOOTSTRAP_EXTERNAL}
      - SPARK_MASTER_URL=spark://10.5.0.3:7077
      - PYSPARK_PYTHON=python3.10
      - PYSPARK_DRIVER_PYTHON=python3.10
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    depends_on:
      - postgresql
      - python
      - minio
    volumes:
      - ./api:/app
      - ./cleaning:/app/cleaning
      - ./mapping:/app/mapping
      - ./transformation:/app/transformation
      - ./analysis:/app/analysis
      - ./machine-learning:/app/machine-learning
    ports:
      - "8000:8000"
    networks:
      spark-network:
        ipv4_address: 10.5.0.9
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
  python:
    build:
      context: .
      dockerfile: .docker/python/Dockerfile
    container_name: python
    image: python-py310
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP}
      - KAFKA_BOOTSTRAP_EXTERNAL=${KAFKA_BOOTSTRAP_EXTERNAL}
      # optional helper variable to point apps in this container to the spark master
      - SPARK_MASTER_URL=spark://10.5.0.3:7077
    ports:
      - "5000:5000"
    networks:
      spark-network:
        ipv4_address: 10.5.0.2
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgresql:
    build:
      context: .
      dockerfile: .docker/postgresql/Dockerfile
    container_name: postgresql
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    networks:
      spark-network:
        ipv4_address: 10.5.0.5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  minio:
    build:
      context: .
      dockerfile: .docker/minio/Dockerfile
    container_name: minio
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      spark-network:
        ipv4_address: 10.5.0.4
    restart: always
    command: server /data --console-address ":9001"

  spark_master:
    build:
      context: .
      dockerfile: .docker/spark/Dockerfile
    image: spark-master-py310
    container_name: spark_master
    env_file:
      - .env
    environment:
      # MUST be the spark_master container's own IP
      - SPARK_MASTER_HOST=10.5.0.3
      - SPARK_LOCAL_IP=10.5.0.3
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - PYSPARK_PYTHON=python3.10
      - PYSPARK_DRIVER_PYTHON=python3.10
      - SPARK_MASTER_OPTS=-Dspark.shuffle.service.enabled=true
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - spark_data:/opt/spark/data
      - ./scripts:/opt/spark/scripts
    networks:
      spark-network:
        ipv4_address: 10.5.0.3
    restart: always
    depends_on:
      - minio
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      spark-network:
        ipv4_address: 10.5.0.6
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      # point to the zookeeper container's IP (zookeeper is at 10.5.0.6)
      KAFKA_ZOOKEEPER_CONNECT: 10.5.0.6:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      # advertise the Kafka container IP (10.5.0.7) so other containers can connect
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.5.0.7:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      spark-network:
        ipv4_address: 10.5.0.7
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  debezium:
    build:
      context: .docker/debezium
      dockerfile: Dockerfile
    container_name: debezium
    depends_on:
      - kafka
      - zookeeper
      - postgresql
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: 10.5.0.7:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /etc/gcp/credentials.json
    volumes:
      - ./jars/gcp-credentials.json:/etc/gcp/credentials.json
      - ./jars/ojdbc8.jar:/kafka/connect/debezium-connector-oracle/ojdbc8.jar
    networks:
      spark-network:
        ipv4_address: 10.5.0.10
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes: 
      - redis_data:/data
    networks:
      spark-network:
        ipv4_address: 10.5.0.11
    restart: always
    command: redis-server --appendonly yes

  nifi:
    build:
      context: .
      dockerfile: .docker/nifi/Dockerfile
    image: nifi:latest
    container_name: nifi
    depends_on:
      - kafka
      - zookeeper
      - minio
      - postgresql
      - redis
    ports:
      - "8081:8080"   # NiFi UI
      - "10000:10000" # Site-to-Site protocol port (optional)
      - "8443:8443" # HTTPS port (optional)
    environment:
      NIFI_JVM_HEAP_INIT: 8g
      NIFI_JVM_HEAP_MAX: 16g
      JAVA_OPTS: >-
        -Xms8g
        -Xmx16g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=500
        -XX:InitiatingHeapOccupancyPercent=45
        -XX:G1HeapRegionSize=16m
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_SENSITIVE_PROPS_KEY: nifi-sensitive-key
      NIFI_SENSITIVE_PROPS_ALGORITHM: AES/GCM/NoPadding
      NIFI_CLUSTER_IS_NODE: "false" # single-node NiFi
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_ADMIN_USER:?NIFI_ADMIN_USER must be set}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_ADMIN_PASSWORD:?NIFI_ADMIN_PASSWORD must be set}
    volumes:
      - nifi_data:/opt/nifi/nifi-current/data
      - ./nifi/custom_processors:/opt/nifi/nifi-current/custom_processors # optional for custom scripts
      - ./nifi/flows:/opt/nifi/nifi-current/flows # prebuilt flows (optional)
    networks:
      spark-network:
        ipv4_address: 10.5.0.12
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # Apache Airflow  (webserver + scheduler, LocalExecutor)
  # UI:  http://localhost:8090   admin / admin  (change via AIRFLOW_ADMIN_*)
  # ─────────────────────────────────────────────────────────────────────────

  # One-shot init container: create the metadata DB and the admin user.
  # It exits after completing; docker restart policy is "on-failure" so it
  # won't loop if it succeeds.
  airflow-init:
    image: apache/airflow:2.8.0-python3.10
    container_name: airflow-init
    depends_on:
      - postgresql
      - redis
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.5.0.5:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-pulse_secret_key_change_me}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/utils:/opt/airflow/utils
      - ./airflow/config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
        airflow db migrate &&
        airflow db upgrade &&
        airflow connections create-default-connections &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Pulse --lastname Admin --role Admin --email admin@pulse.local
      "
    networks:
      spark-network:
        ipv4_address: 10.5.0.16
    restart: on-failure

  airflow-webserver:
    image: apache/airflow:2.8.0-python3.10
    container_name: airflow-webserver
    depends_on:
      - airflow-init
      - postgresql
      - redis
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.5.0.5:5432/airflow
      - AIRFLOW__WEBSERVER__RATE_LIMIT_STORAGE_URL=redis://10.5.0.11:6379/0
      - AIRFLOW__WEBSERVER__RATE_LIMIT_ENABLED=True
      - AIRFLOW__WEBSERVER__RATE_LIMIT_DEFAULT=200 per day;50 per hour
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0jJgrg=}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-pulse_secret_key_change_me}
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__PLUGINS_FOLDER=/opt/airflow/plugins
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/opt/airflow/logs
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE_NAME=${POSTGRES_DATABASE_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - REDIS_HOST=${REDIS_HOST:-10.5.0.11}
      - DEBEZIUM_URL=http://10.5.0.10:8083
      - PIPELINE_PYTHON_CONTAINER=python
      - PYTHONPATH=/opt/airflow/utils:/opt/airflow/config
    ports:
      - "8090:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/utils:/opt/airflow/utils
      - ./airflow/config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver
    networks:
      spark-network:
        ipv4_address: 10.5.0.17
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.10
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@10.5.0.5:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0jJgrg=}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-pulse_secret_key_change_me}
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__PLUGINS_FOLDER=/opt/airflow/plugins
      - AIRFLOW__LOGGING__BASE_LOG_FOLDER=/opt/airflow/logs
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - KAFKA_BOOTSTRAP=${KAFKA_BOOTSTRAP}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE_NAME=${POSTGRES_DATABASE_NAME}
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - REDIS_HOST=${REDIS_HOST:-10.5.0.11}
      - DEBEZIUM_URL=http://10.5.0.10:8083
      - PIPELINE_PYTHON_CONTAINER=python
      - PYTHONPATH=/opt/airflow/utils:/opt/airflow/config
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/utils:/opt/airflow/utils
      - ./airflow/config:/opt/airflow/config
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    networks:
      spark-network:
        ipv4_address: 10.5.0.18
    restart: always

  nginx:
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    image: nginx:latest
    container_name: nginx
    env_file:
      - .env
    environment:
      - NGINX_MODE=${NGINX_MODE:-development}
      - NGINX_DOMAIN=${NGINX_DOMAIN:-localhost}
      - NGINX_HTTP_PORT=${NGINX_HTTP_PORT:-8082}
      - NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-9443}
    ports:
      - "${NGINX_HTTP_PORT:-8082}:80"      # HTTP (dev) or redirect (prod)
      - "${NGINX_HTTPS_PORT:-9443}:443"    # HTTPS (prod) or unused (dev)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      spark-network:
        ipv4_address: 10.5.0.13
    depends_on:
      - nifi
    restart: always

networks:
  spark-network:
    name: spark-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16

volumes:
  postgres_data:
  minio_data:
  spark_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  app:
  redis_data:
  nifi_data:
  airflow_logs:
