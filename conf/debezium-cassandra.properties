# =============================================================================
# Debezium Server — Cassandra connector configuration
# =============================================================================
# This file is mounted into the debezium-cassandra container at:
#   /debezium/conf/application.properties
#
# The debezium-cassandra service uses quay.io/debezium/server:3.4 which reads
# commit log segments directly from the shared cassandra_commitlog volume.
#
# Before starting the stack, enable CDC on each Cassandra table you want to
# stream by connecting to Cassandra and running:
#   ALTER TABLE your_keyspace.orders   WITH cdc = true;
#   ALTER TABLE your_keyspace.payments WITH cdc = true;
#
# Update the cassandra.keyspace and cassandra.password values below to match
# your Cassandra setup.
# =============================================================================

# ── Source: Cassandra connector ───────────────────────────────────────────────
debezium.source.connector.class=io.debezium.connector.cassandra.CassandraConnector

# Cassandra node — uses the cassandra service IP on the shared spark-network
debezium.source.cassandra.hosts=10.5.0.55
debezium.source.cassandra.port=9042

# Credentials — must match the debezium_user created in Cassandra
debezium.source.cassandra.user=debezium_user
debezium.source.cassandra.password=CHANGE_ME

# Keyspace to capture
debezium.source.cassandra.keyspace=CHANGE_ME

# Commit log directory shared with the cassandra container via named volume
debezium.source.commitlog.dir=/cassandra/commitlog

# Topic prefix — topics will be published as ecom.<keyspace>.<table>
debezium.source.topic.prefix=ecom

# ── Sink: Kafka ───────────────────────────────────────────────────────────────
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=10.5.0.7:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
