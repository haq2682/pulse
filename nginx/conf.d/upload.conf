# =============================================================================
# Pulse nginx gateway
#   - Serves the built React SPA (same origin as the API -> no CORS needed)
#   - /api/*  -> FastAPI (service name: api), WebSocket upgrades included
#   - /upload -> NiFi (HandleHttpRequest), large-file upload settings
#   - /health -> FastAPI health endpoint
#
# HTTP-only on purpose: TLS is terminated upstream (cloud LB / K8s ingress),
# which is where the certs live. This keeps the image cert-free and startable
# anywhere without mounting an ssl directory.
#
# Service names (api / nifi) resolve via Docker's embedded DNS on the
# spark-network and via Kubernetes service names in prod.
# =============================================================================

# Large file upload settings
client_max_body_size 10G;
client_body_timeout 1800s;
client_header_timeout 1800s;
proxy_connect_timeout 1800s;
proxy_send_timeout 1800s;
proxy_read_timeout 1800s;
send_timeout 1800s;

# Buffer settings
client_body_buffer_size 256k;
proxy_buffering off;
proxy_request_buffering off;

# Upstream to NiFi HandleHttpRequest
upstream nifi_upload {
    least_conn;
    server nifi:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API proxy: /api/* -> FastAPI (prefix stripped) ──────────────────
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (analytics + xai streams)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # ── Health check ─────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    # ── Prometheus metrics source ────────────────────────────────────────
    # nginx's built-in stub_status module. Restricted to 127.0.0.1 because
    # the pulse-nginx-exporter sidecar (see deployment.yaml) reaches it over
    # localhost - containers in the same pod share a network namespace, so
    # this never needs to be reachable from anywhere else.
    location = /stub_status {
        access_log off;
        allow 127.0.0.1;
        deny all;
        stub_status;
    }

    # ── NiFi upload endpoint ─────────────────────────────────────────────
    location /upload {
        proxy_pass http://nifi_upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-File-Id $http_x_file_id;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-Business-Id $http_x_business_id;
        proxy_pass_header Content-Type;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # CORS — dev only (dev frontend on :5173 uploads cross-origin to the
        # gateway). In prod the SPA is served same-origin through this gateway,
        # so these headers are inert and no preflight occurs.
        set $cors_origin "";
        if ($http_origin ~* '^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?)$') {
            set $cors_origin $http_origin;
        }
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-File-Id, X-User-Id, X-Business-Id, X-File-Name, X-File-Size, X-File-Type' always;
        add_header 'Access-Control-Max-Age' '3600' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ── React SPA (client-side routing fallback) ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
