# Large file upload settings
client_max_body_size 10G;
client_body_timeout 1800s;
client_header_timeout 1800s;
proxy_connect_timeout 1800s;
proxy_send_timeout 1800s;
proxy_read_timeout 1800s;
send_timeout 1800s;

# Buffer settings
client_body_buffer_size 256k;
proxy_buffering off;
proxy_request_buffering off;

# Upstream to NiFi HandleHttpRequest
upstream nifi_upload {
    least_conn;
    server 10.5.0.12:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP Server
server {
    listen 80;
    server_name localhost;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers — only allow localhost origins
    set $cors_origin "";
    if ($http_origin ~* '^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?)$') {
        set $cors_origin $http_origin;
    }
    add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-File-Id, X-User-Id, X-Business-Id, X-File-Name, X-File-Size, X-File-Type' always;
    add_header 'Access-Control-Max-Age' '3600' always;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Upload endpoint
    location /upload {
        proxy_pass http://nifi_upload;
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward custom headers to NiFi
        proxy_set_header X-File-Id $http_x_file_id;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-Business-Id $http_x_business_id;
        proxy_pass_header Content-Type;
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Large file upload settings
    client_max_body_size 10G;
    client_body_timeout 1800s;
    proxy_buffering off;
    proxy_request_buffering off;

    # ── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers — only allow localhost origins
    set $cors_origin "";
    if ($http_origin ~* '^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?)$') {
        set $cors_origin $http_origin;
    }
    add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-File-Id, X-User-Id, X-Business-Id, X-File-Name, X-File-Size, X-File-Type' always;
    add_header 'Access-Control-Max-Age' '3600' always;

    # Handle preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Upload endpoint
    location /upload {
        proxy_pass http://nifi_upload;
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward custom headers to NiFi
        proxy_set_header X-File-Id $http_x_file_id;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-Business-Id $http_x_business_id;
        proxy_pass_header Content-Type;
        
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}